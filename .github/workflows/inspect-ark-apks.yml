name: Inspect ARK APKS asset
on:
  push:
    paths:
      - '.github/workflows/inspect-ark-apks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download the exact uploaded Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ark-inspect" "$RUNNER_TEMP/apks"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/683305514" \
            --output "$RUNNER_TEMP/apks/tryrtyrt.apks"
          stat -c 'Downloaded bytes: %s' "$RUNNER_TEMP/apks/tryrtyrt.apks"
          echo "Expected GitHub asset size: 1719866207"
          echo "Actual SHA256: $(sha256sum "$RUNNER_TEMP/apks/tryrtyrt.apks" | cut -d' ' -f1)"
          echo "Expected SHA256: 8a49c3776c38ae6e82fbe8edd2a85c2cadfd96f1515b08168543eb666dc116a4"
      - name: Inventory outer APKS and every nested APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile, hashlib, tempfile, shutil, re, collections
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          apks = base / 'apks' / 'tryrtyrt.apks'
          out = base / 'ark-inspect'
          out.mkdir(parents=True, exist_ok=True)
          expected_size = 1719866207
          expected_sha = '8a49c3776c38ae6e82fbe8edd2a85c2cadfd96f1515b08168543eb666dc116a4'
          size = apks.stat().st_size
          h = hashlib.sha256()
          with apks.open('rb') as f:
              for block in iter(lambda: f.read(8 * 1024 * 1024), b''): h.update(block)
          digest = h.hexdigest()
          if size != expected_size or digest != expected_sha:
              raise SystemExit(f'Asset verification FAILED: size={size}, sha256={digest}')
          lines = ['# ARK APKS inspection report', '',
                   f'- Exact uploaded asset: `tryrtyrt.apks`',
                   f'- Download size: **{size:,} bytes** ({size/1024/1024/1024:.3f} GiB)',
                   f'- SHA-256: `{digest}` (matches the digest recorded by GitHub)',
                   '- Analysis method: ZIP/APK structure and filenames only; no app code executed.', '']
          inventory = ['scope\tpath\tuncompressed_bytes\tcompressed_bytes\tcompression']
          relevant = []
          ext_totals = collections.Counter()
          indicators = collections.Counter()
          engine_examples = []
          ui_examples = []
          apk_summaries = []
          def ext_for(name):
              return Path(name.lower()).suffix or '[no extension]'
          ui_re = re.compile(r'(ui|hud|menu|widget|font|icon|atlas|texture|sprite|button|panel|window|logo|interface|screen|material|\.uasset$|\.umap$|\.uexp$)', re.I)
          unreal_re = re.compile(r'(\.pak$|\.ucas$|\.utoc$|\.uasset$|\.umap$|\.uexp$|libUE4\.so|libUnreal\.so|UnrealEngine|/Engine/)', re.I)
          unity_re = re.compile(r'(libunity\.so|libil2cpp\.so|global-metadata\.dat|assets/bin/Data/|sharedassets.*\.assets$|resources\.assets$)', re.I)
          try:
              outer = zipfile.ZipFile(apks, 'r')
              outer_entries = outer.infolist()
          except Exception as e:
              raise SystemExit(f'File is not a readable ZIP/APKS archive: {e}')
          lines += [f'## Outer APKS archive', f'- Top-level entries: **{len(outer_entries)}**',
                    '- Entry listing:', '']
          for i in outer_entries:
              inventory.append(f"APKS\t{i.filename}\t{i.file_size}\t{i.compress_size}\t{i.compress_type}")
              lines.append(f'- `{i.filename}` — {i.file_size:,} bytes')
          apk_entries = [i for i in outer_entries if i.filename.lower().endswith('.apk') and not i.is_dir()]
          lines += ['', f'## Nested APK splits: {len(apk_entries)}', '']
          if not apk_entries: lines.append('**No nested `.apk` files were found.**')
          for idx, ent in enumerate(apk_entries, 1):
              lines.append(f'### {idx}. `{ent.filename}`')
              tmp = base / f'inspect_split_{idx}.apk'
              try:
                  with outer.open(ent, 'r') as src, tmp.open('wb') as dst: shutil.copyfileobj(src, dst, 8 * 1024 * 1024)
                  zapk = zipfile.ZipFile(tmp, 'r')
                  inner = zapk.infolist()
                  local_ext = collections.Counter()
                  manifest_found = False
                  dex = []
                  native = []
                  assets_count = 0
                  pak_hits = []
                  max_files = sorted(inner, key=lambda x:x.file_size, reverse=True)[:12]
                  for item in inner:
                      path = item.filename
                      ext = ext_for(path)
                      local_ext[ext] += 1
                      ext_totals[ext] += 1
                      inventory.append(f"{ent.filename}\t{path}\t{item.file_size}\t{item.compress_size}\t{item.compress_type}")
                      low = path.lower()
                      if path == 'AndroidManifest.xml': manifest_found = True
                      if re.fullmatch(r'classes(\d+)?\.dex', path.split('/')[-1]): dex.append(path)
                      if '/lib/' in ('/'+low) or low.endswith('.so'): native.append(path)
                      if low.startswith('assets/'): assets_count += 1
                      if low.endswith(('.pak','.ucas','.utoc','.uasset','.umap','.uexp')): pak_hits.append((path,item.file_size))
                      if unreal_re.search(path):
                          indicators['Unreal-style names'] += 1
                          if len(engine_examples)<100: engine_examples.append((ent.filename,path,item.file_size))
                      if unity_re.search(path):
                          indicators['Unity-style names'] += 1
                          if len(engine_examples)<100: engine_examples.append((ent.filename,path,item.file_size))
                      if ui_re.search(path) and len(ui_examples)<300:
                          ui_examples.append((ent.filename,path,item.file_size))
                      relevant.append((ent.filename,path,item.file_size))
                  lines += [f'- Uncompressed APK size: {ent.file_size:,} bytes',
                            f'- Internal entries: {len(inner):,}',
                            f'- `AndroidManifest.xml` present: {manifest_found}',
                            f'- DEX bytecode files: {len(dex)}' + (f' ({", ".join(dex[:12])})' if dex else ''),
                            f'- Native `.so` libraries: {sum(1 for x in inner if x.filename.lower().endswith(".so"))}',
                            f'- `assets/` entries: {assets_count:,}',
                            f'- Top file types: {", ".join(f"{k}={v}" for k,v in local_ext.most_common(15))}',
                            '- Largest internal entries:']
                  for item in max_files:
                      lines.append(f'  - `{item.filename}` — {item.file_size:,} bytes')
                  if pak_hits:
                      lines.append('- Unreal/game resource containers and asset files found:')
                      for path,n in pak_hits[:100]: lines.append(f'  - `{path}` — {n:,} bytes')
                  else:
                      lines.append('- No `.pak`, `.ucas`, `.utoc`, `.uasset`, `.umap`, or `.uexp` files were found in this split.')
                  apk_summaries.append({'name':ent.filename,'entries':len(inner),'assets':assets_count,'manifest':manifest_found,'files':inner})
              except Exception as e:
                  lines.append(f'- **ERROR inspecting this APK:** {type(e).__name__}: {e}')
              finally:
                  try: tmp.unlink(missing_ok=True)
                  except Exception: pass
          lines += ['', '## Engine and UI indicators', '']
          if indicators:
              for k,v in indicators.items(): lines.append(f'- {k}: {v} matching archive paths')
          else: lines.append('- No obvious Unreal or Unity filename indicators were detected from the inspected paths.')
          lines += ['', '### UI-like / graphics-like filenames (up to 300)', '']
          if ui_examples:
              for scope,path,n in ui_examples: lines.append(f'- `{scope}` → `{path}` — {n:,} bytes')
          else: lines.append('- No filename matched common UI/graphics keywords; this does not prove that UI resources are absent.')
          lines += ['', '### Engine-related filenames (up to 100)', '']
          if engine_examples:
              seen=set()
              for scope,path,n in engine_examples:
                  key=(scope,path)
                  if key not in seen:
                      seen.add(key); lines.append(f'- `{scope}` → `{path}` — {n:,} bytes')
          else: lines.append('- No obvious engine-specific resource path found.')
          lines += ['', '## Important limitation',
                    'This report inspects only the downloaded `.apks` archive and APK splits inside it. It cannot prove that post-install game data downloaded separately from Google Play or from the game servers is included. No files were installed or executed.',
                    '']
          (out/'report.md').write_text('\n'.join(lines), encoding='utf-8')
          (out/'archive_inventory.tsv').write_text('\n'.join(inventory)+'\n', encoding='utf-8')
          print('\n'.join(lines[:80]))
          print(f'Wrote report and inventory; inventory lines={len(inventory):,}')
          PY
      - name: Upload text-only inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ark-apks-inspection
          path: |
            ${{ runner.temp }}/ark-inspect/report.md
            ${{ runner.temp }}/ark-inspect/archive_inventory.tsv
          retention-days: 3
