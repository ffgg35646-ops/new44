name: Inspect uploaded ARK APKS
on:
  push:
    paths:
      - '.github/workflows/inspect-ark-apks.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Diagnose GitHub API access and download asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'ERROR: The built-in GITHUB_TOKEN is unavailable.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ark-inspect" "$RUNNER_TEMP/apks"
          api='https://api.github.com'
          headers=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          get_json() {
            local path="$1" outfile="$2"
            local code
            code=$(curl --silent --show-error --location --max-time 30 -o "$outfile" -w '%{http_code}' "${headers[@]}" "$api$path") || true
            echo "API GET $path -> HTTP ${code:-curl-error}"
            python - "$outfile" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              d=json.load(open(p,encoding='utf-8'))
              if isinstance(d,dict):
                  for k in ('message','documentation_url','login','name','tag_name','draft','state','size','browser_download_url','permissions','private','visibility'):
                      if k in d: print(f'{k}: {d[k]}')
              else: print(f'Response is JSON {type(d).__name__}; items={len(d)}')
          except Exception:
              print(open(p,'rb').read(500).decode('utf-8','replace'))
          PY
          }
          get_json '/user' "$RUNNER_TEMP/ark-inspect/user.json"
          get_json '/repos/ffgg35646-ops/new44' "$RUNNER_TEMP/ark-inspect/repo.json"
          get_json '/repos/ffgg35646-ops/new44/releases/426131202' "$RUNNER_TEMP/ark-inspect/release.json"
          get_json '/repos/ffgg35646-ops/new44/releases/assets/683305514' "$RUNNER_TEMP/ark-inspect/asset.json"
          echo '--- Testing binary endpoint without following redirects ---'
          asset_url="$api/repos/ffgg35646-ops/new44/releases/assets/683305514"
          code=$(curl --silent --show-error --max-time 60 -D "$RUNNER_TEMP/ark-inspect/asset-headers.txt" -o "$RUNNER_TEMP/ark-inspect/asset-response.bin" -w '%{http_code}' -H 'Accept: application/octet-stream' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$asset_url") || true
          unset GH_TOKEN
          echo "Binary endpoint initial status: ${code:-curl-error}"
          grep -iE '^(HTTP/|location:|content-type:)' "$RUNNER_TEMP/ark-inspect/asset-headers.txt" || true
          if [[ "$code" == '200' ]]; then
            cp "$RUNNER_TEMP/ark-inspect/asset-response.bin" "$RUNNER_TEMP/apks/tryrtyrt.apks"
          elif [[ "$code" == '302' || "$code" == '301' || "$code" == '307' || "$code" == '308' ]]; then
            location=$(python - "$RUNNER_TEMP/ark-inspect/asset-headers.txt" <<'PY'
          import sys
          vals=[x.split(':',1)[1].strip() for x in open(sys.argv[1],errors='replace') if x.lower().startswith('location:')]
          print(vals[-1] if vals else '')
          PY
          )
            if [[ -z "$location" ]]; then echo 'ERROR: redirect had no Location header'; exit 1; fi
            echo 'Redirect provided; downloading its temporary location without forwarding the API token.'
            curl --fail --location --retry 2 --retry-all-errors --silent --show-error --max-time 5400 "$location" -o "$RUNNER_TEMP/apks/tryrtyrt.apks"
          else
            echo '--- Safe response body excerpt ---'
            head -c 1500 "$RUNNER_TEMP/ark-inspect/asset-response.bin" | strings | head -c 1500 || true
            echo
            echo 'Download stopped so the exact access error can be diagnosed from the metadata above.'
            exit 1
          fi
          actual_size=$(stat -c '%s' "$RUNNER_TEMP/apks/tryrtyrt.apks")
          actual_sha=$(sha256sum "$RUNNER_TEMP/apks/tryrtyrt.apks" | cut -d' ' -f1)
          echo "Downloaded bytes: ${actual_size}"
          echo "Downloaded SHA-256: ${actual_sha}"
          if [[ "$actual_size" != '1719866207' || "$actual_sha" != '8a49c3776c38ae6e82fbe8edd2a85c2cadfd96f1515b08168543eb666dc116a4' ]]; then
            echo 'ERROR: downloaded bytes do not match the GitHub asset size and digest.'
            exit 1
          fi
      - name: Inventory APKS and nested APK file contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile, hashlib, shutil, re, collections
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP']); apks=base/'apks'/'tryrtyrt.apks'; out=base/'ark-inspect'; out.mkdir(parents=True,exist_ok=True)
          h=hashlib.sha256()
          with apks.open('rb') as f:
              for b in iter(lambda:f.read(8*1024*1024),b''): h.update(b)
          lines=['# ARK APKS inspection report','',f'- Asset: `tryrtyrt.apks`',f'- Size: {apks.stat().st_size:,} bytes',f'- SHA-256: `{h.hexdigest()}`','- No APK installed or executed.','']
          inventory=['scope\tpath\tuncompressed_bytes\tcompressed_bytes\tcompression_method']; ui=[]; unreal=[]; unity=[]
          ui_re=re.compile(r'(ui|hud|menu|widget|font|icon|atlas|texture|sprite|button|panel|window|logo|interface|screen|material|\.uasset$|\.umap$|\.uexp$)',re.I)
          ue_re=re.compile(r'(\.pak$|\.ucas$|\.utoc$|\.uasset$|\.umap$|\.uexp$|libUE4\.so|libUnreal\.so|UnrealEngine|/Engine/)',re.I)
          un_re=re.compile(r'(libunity\.so|libil2cpp\.so|global-metadata\.dat|assets/bin/Data/|sharedassets.*\.assets$|resources\.assets$)',re.I)
          with zipfile.ZipFile(apks) as outer:
              outer_infos=outer.infolist(); lines+=['## Outer APKS entries',f'- Count: {len(outer_infos)}','']
              for x in outer_infos:
                  inventory.append(f'APKS\t{x.filename}\t{x.file_size}\t{x.compress_size}\t{x.compress_type}'); lines.append(f'- `{x.filename}` — {x.file_size:,} bytes')
                  if x.filename == 'APKCube.txt':
                      try: lines += ['', '### Bundler metadata file (APKCube.txt)', f'`{outer.read(x).decode("utf-8", "replace").strip()}`', '']
                      except Exception as exc: lines.append(f'- Could not read APKCube.txt: {exc}')
              apk_infos=[x for x in outer_infos if x.filename.lower().endswith('.apk') and not x.is_dir()]
              lines+=['',f'## APK splits: {len(apk_infos)}','']
              for idx,x in enumerate(apk_infos,1):
                  tmp=base/f'split-{idx}.apk'; lines.append(f'### `{x.filename}`')
                  try:
                      with outer.open(x) as src,tmp.open('wb') as dst: shutil.copyfileobj(src,dst,8*1024*1024)
                      with zipfile.ZipFile(tmp) as apk:
                          es=apk.infolist(); exts=collections.Counter(Path(e.filename.lower()).suffix or '[no extension]' for e in es)
                          dex=[e.filename for e in es if re.fullmatch(r'classes(\d+)?\.dex',e.filename.rsplit('/',1)[-1])]
                          assets=[e for e in es if e.filename.lower().startswith('assets/') and not e.is_dir()]
                          native=[e for e in es if e.filename.lower().endswith('.so')]
                          resources=[]
                          for e in es:
                              p=e.filename; inventory.append(f'{x.filename}\t{p}\t{e.file_size}\t{e.compress_size}\t{e.compress_type}')
                              if ui_re.search(p) and len(ui)<800: ui.append((x.filename,p,e.file_size))
                              if ue_re.search(p) and len(unreal)<800: unreal.append((x.filename,p,e.file_size))
                              if un_re.search(p) and len(unity)<800: unity.append((x.filename,p,e.file_size))
                              if p.lower().endswith(('.pak','.ucas','.utoc','.uasset','.umap','.uexp')): resources.append(e)
                          lines += [f'- Uncompressed size: {x.file_size:,} bytes',f'- Entries: {len(es):,}',f'- AndroidManifest.xml present: {any(e.filename=="AndroidManifest.xml" for e in es)}',f'- DEX: {len(dex)}; native SO: {len(native)}; assets/: {len(assets)}',f'- Common extensions: {", ".join(f"{k}={v}" for k,v in exts.most_common(20))}','- Largest entries:']
                          for e in sorted(es,key=lambda z:z.file_size,reverse=True)[:20]: lines.append(f'  - `{e.filename}` — {e.file_size:,} bytes')
                          lines.append(f'- UE packaged-resource extensions: {len(resources)}')
                          for e in resources[:200]: lines.append(f'  - `{e.filename}` — {e.file_size:,} bytes')
                          for e in es:
                              if e.filename == 'assets/main.obb.png':
                                  lines += ['', '#### Large game-data payload signature check', f'- Path: `{e.filename}`', f'- Size: {e.file_size:,} bytes', f'- APK ZIP compression method: {e.compress_type} (0 means stored without ZIP compression)']
                                  try:
                                      with apk.open(e) as payload:
                                          first = payload.read(64)
                                          try:
                                              payload.seek(max(0, e.file_size - 64))
                                              last = payload.read(64)
                                          except Exception:
                                              last = b''
                                      def printable(b): return ''.join(chr(c) if 32 <= c < 127 else '.' for c in b)
                                      lines += [f'- First 64 bytes (hex): `{first.hex()}`', f'- First bytes (ASCII view): `{printable(first)}`', f'- Last bytes (hex): `{last.hex()}`', f'- Last bytes (ASCII view): `{printable(last)}`']
                                      signatures = {'PNG signature': bytes.fromhex('89504e470d0a1a0a'), 'ZIP local header': b'PK\\x03\\x04', 'GZIP': bytes.fromhex('1f8b'), '7z': bytes.fromhex('377abcaf271c'), 'SQLite': b'SQLite format 3', 'UE4 PAK magic little-endian': bytes.fromhex('e1126f5a'), 'Zstandard': bytes.fromhex('28b52ffd')}
                                      hits = [name for name, sig in signatures.items() if sig in first or sig in last]
                                      lines.append(f'- Recognized signatures present in first/last sample: {", ".join(hits) if hits else "none of the checked signatures"}')
                                      try:
                                          with apk.open(e) as payload:
                                              with zipfile.ZipFile(payload, 'r') as gamezip:
                                                  game_entries = gamezip.infolist()
                                                  lines += ['', '#### Embedded game-data archive entries', f'- The large payload is readable as a ZIP archive with **{len(game_entries)} entries**:', '']
                                                  for gi in game_entries:
                                                      lines.append(f'- `{gi.filename}` — uncompressed {gi.file_size:,} bytes; stored size {gi.compress_size:,}; method={gi.compress_type}')
                                                      if gi.filename.lower().endswith('.pak'):
                                                          pak_out_dir = out / 'paks'
                                                          pak_out_dir.mkdir(parents=True, exist_ok=True)
                                                          pak_target = pak_out_dir / Path(gi.filename).name
                                                          with gamezip.open(gi) as psrc, pak_target.open('wb') as pdst:
                                                              shutil.copyfileobj(psrc, pdst, 8 * 1024 * 1024)
                                                          lines.append(f'  - Copied raw PAK for index listing: `{pak_target.name}` ({pak_target.stat().st_size:,} bytes)')
                                                      try:
                                                          with gamezip.open(gi) as gf:
                                                              gh = gf.read(32)
                                                              foot = b''
                                                              if gi.filename.lower().endswith('.pak'):
                                                                  try:
                                                                      gf.seek(max(0, gi.file_size - 4096))
                                                                      foot = gf.read(4096)
                                                                  except Exception:
                                                                      foot = b''
                                                          lines.append(f'  - First 32 bytes: `{gh.hex()}` | `{printable(gh)}`')
                                                          if gi.filename.lower().endswith('.pak'):
                                                              magic = bytes.fromhex('e1126f5a')
                                                              offsets = [m.start() for m in re.finditer(re.escape(magic), foot)]
                                                              lines.append(f'  - UE4 PAK magic (E1 12 6F 5A) offsets in final 4096 bytes: {offsets if offsets else "not found"}')
                                                              if offsets:
                                                                  q = offsets[-1]
                                                                  if len(foot) >= q + 204 and q >= 17:
                                                                      version = int.from_bytes(foot[q+4:q+8], 'little')
                                                                      index_offset = int.from_bytes(foot[q+8:q+16], 'little', signed=True)
                                                                      index_size = int.from_bytes(foot[q+16:q+24], 'little', signed=True)
                                                                      index_hash = foot[q+24:q+44].hex()
                                                                      encrypted_flag = foot[q-1]
                                                                      key_guid = foot[q-17:q-1].hex()
                                                                      methods = [foot[q+44+i*32:q+44+(i+1)*32].split(bytes([0]),1)[0].decode('ascii','replace') for i in range(5)]
                                                                      lines.append(f'  - Parsed footer: version={version}, index_offset={index_offset}, index_size={index_size}, encrypted_index={encrypted_flag} (0=no, 1=yes), key_guid={key_guid}')
                                                                      lines.append(f'  - PAK compression methods: {methods}')
                                                                      try:
                                                                          with gamezip.open(gi) as gf:
                                                                              gf.seek(index_offset)
                                                                              index_data = gf.read(index_size)
                                                                          actual_index_hash = hashlib.sha1(index_data).hexdigest()
                                                                          lines.append(f'  - Index SHA-1: stored={index_hash}; computed={actual_index_hash}; match={actual_index_hash == index_hash}')
                                                                          lines.append(f'  - Index first 64 bytes: `{index_data[:64].hex()}`')
                                                                      except Exception as index_exc:
                                                                          lines.append(f'  - Could not verify/read PAK index: {type(index_exc).__name__}: {index_exc}')
                                                          if gi.filename == 'ShooterGame/Script/UI/MainMenu.as':
                                                              with gamezip.open(gi) as gf: script = gf.read(4096).decode('utf-8', 'replace').strip()
                                                              lines.append('  - MainMenu script content: ' + script.replace(chr(10), ' '))
                                                      except Exception as sig_exc:
                                                          lines.append(f'  - Could not read signature sample: {type(sig_exc).__name__}: {sig_exc}')
                                      except Exception as nested_exc:
                                          lines.append(f'- Could not parse the inner payload as a ZIP: {type(nested_exc).__name__}: {nested_exc}')
                                  except Exception as exc:
                                      lines.append(f'- Could not sample payload signature: {type(exc).__name__}: {exc}')
                  except Exception as exc: lines.append(f'- ERROR inspecting APK: {type(exc).__name__}: {exc}')
                  finally: tmp.unlink(missing_ok=True)
          for title,items in [('UI/graphics filename candidates',ui),('Unreal Engine filename candidates',unreal),('Unity filename candidates',unity)]:
              lines+=['',f'## {title}', '']
              lines += [f'- `{scope}` → `{p}` — {n:,} bytes' for scope,p,n in items] if items else ['- No obvious file-path matches; resources may use generic or packed names.']
          lines+=['','## Limitation','- This inventories this APKS archive and APK splits only. Any game data downloaded separately at runtime may not be included.','']
          (out/'report.md').write_text('\n'.join(lines),encoding='utf-8'); (out/'archive_inventory.tsv').write_text('\n'.join(inventory)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          print(f'Inventory rows: {len(inventory)-1:,}')
          PY
      - name: List Unreal PAK contents with repak
        shell: bash
        run: |
          set -u
          root="$RUNNER_TEMP/ark-inspect"
          tools_dir="$RUNNER_TEMP/repak-tool"
          list_dir="$root/pak-file-lists"
          mkdir -p "$tools_dir" "$list_dir"
          cd "$tools_dir"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o repak_cli.tar.xz \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o repak_cli.tar.xz.sha256 \
            https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz.sha256
          echo 'Verifying repak release checksum'
          if ! sha256sum -c repak_cli.tar.xz.sha256; then
            echo 'Checksum file uses a different filename format; checking the digest directly.'
            expected=$(awk 'NR==1 {print $1}' repak_cli.tar.xz.sha256)
            actual=$(sha256sum repak_cli.tar.xz | awk '{print $1}')
            echo "Expected: $expected"
            echo "Actual:   $actual"
            [[ "$expected" == "$actual" ]] || exit 1
          fi
          mkdir unpacked
          tar -xJf repak_cli.tar.xz -C unpacked
          repak_bin=$(find unpacked -type f -name repak -print -quit)
          if [[ -z "$repak_bin" ]]; then
            echo 'Could not find the repak executable in the release archive.'
            find unpacked -maxdepth 3 -type f -print
            exit 1
          fi
          chmod +x "$repak_bin"
          "$repak_bin" --version || true
          printf '# Unreal PAK index listing results\n\n' > "$root/pak-index-summary.md"
          printf 'The PAK files were extracted from the uploaded APKS only into the temporary GitHub Actions runner. This report lists container indexes; it does not republish the game files.\n\n' >> "$root/pak-index-summary.md"
          shopt -s nullglob
          found=0
          for pak in "$root"/paks/*.pak; do
            found=1
            name=$(basename "$pak")
            list="$list_dir/$name.txt"
            info="$list_dir/$name.info.txt"
            errors="$list_dir/$name.errors.txt"
            echo "Listing: $name ($(stat -c '%s' "$pak") bytes)"
            if "$repak_bin" info "$pak" > "$info" 2> "$errors.info"; then
              echo "## $name" >> "$root/pak-index-summary.md"
              echo >> "$root/pak-index-summary.md"
              sed -n '1,80p' "$info" >> "$root/pak-index-summary.md"
              echo >> "$root/pak-index-summary.md"
            else
              echo "## $name — repak info failed" >> "$root/pak-index-summary.md"
              cat "$errors.info" >> "$root/pak-index-summary.md"
            fi
            if "$repak_bin" list "$pak" > "$list" 2> "$errors"; then
              n=$(wc -l < "$list" | tr -d ' ')
              echo "- Listed paths: **$n**. Full path list: `pak-file-lists/$name.txt`." >> "$root/pak-index-summary.md"
              echo >> "$root/pak-index-summary.md"
              echo '### Likely UI, menu, fonts and graphics path matches (up to 250)' >> "$root/pak-index-summary.md"
              if ! grep -Ei '(ui|hud|menu|widget|font|icon|button|inventory|mainmenu|pause|settings|blueprint|\.uasset$|\.uexp$|\.png$|\.tga$|\.jpg$|\.ttf$|\.otf$)' "$list" | head -n 250 >> "$root/pak-index-summary.md"; then
                echo '- No path matched the quick UI/graphics filter; files may have generic names.' >> "$root/pak-index-summary.md"
              fi
              echo >> "$root/pak-index-summary.md"
            else
              echo "- repak list failed for this PAK; see `pak-file-lists/$name.errors.txt`." >> "$root/pak-index-summary.md"
              sed -n '1,100p' "$errors" >> "$root/pak-index-summary.md"
              echo >> "$root/pak-index-summary.md"
            fi
          done
          if [[ "$found" == '0' ]]; then
            echo 'No extracted PAK files were found.' | tee -a "$root/pak-index-summary.md"
            exit 1
          fi
          echo 'Generated summary:'
          sed -n '1,260p' "$root/pak-index-summary.md"
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: ark-apks-inspection
          path: |
            ${{ runner.temp }}/ark-inspect/report.md
            ${{ runner.temp }}/ark-inspect/archive_inventory.tsv
            ${{ runner.temp }}/ark-inspect/pak-index-summary.md
            ${{ runner.temp }}/ark-inspect/pak-file-lists/
          retention-days: 7
