name: Targeted ARK dinosaur visibility probe

on:
  push:
    branches:
      - dino-distance-probe
    paths:
      - '.github/workflows/dino-distance-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download and verify the exact uploaded APKS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dino-probe"
          mkdir -p "$root"
          api='https://api.github.com/repos/ffgg35646-ops/new44/releases/assets/683305514'
          code=$(curl --silent --show-error --max-time 60 -D "$root/headers.txt" -o "$root/response.bin" -w '%{http_code}' \
            -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$api" || true)
          unset GH_TOKEN
          if [[ "$code" == "200" ]]; then
            mv "$root/response.bin" "$root/tryrtyrt.apks"
          elif [[ "$code" == "302" || "$code" == "301" || "$code" == "307" || "$code" == "308" ]]; then
            location=$(python - "$root/headers.txt" <<'PY'
          import sys
          vals=[x.split(':',1)[1].strip() for x in open(sys.argv[1],errors='replace') if x.lower().startswith('location:')]
          print(vals[-1] if vals else '')
          PY
          )
            test -n "$location"
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error --max-time 5400 "$location" -o "$root/tryrtyrt.apks"
          else
            echo "Asset download failed with HTTP $code"
            head -c 1000 "$root/response.bin" || true
            exit 1
          fi
          actual_size=$(stat -c '%s' "$root/tryrtyrt.apks")
          actual_sha=$(sha256sum "$root/tryrtyrt.apks" | cut -d' ' -f1)
          echo "Bytes: $actual_size"
          echo "SHA-256: $actual_sha"
          [[ "$actual_size" == "1719866207" ]]
          [[ "$actual_sha" == "8a49c3776c38ae6e82fbe8edd2a85c2cadfd96f1515b08168543eb666dc116a4" ]]

      - name: Extract only the main PAK from nested game archive
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dino-probe"
          python - "$root" <<'PY'
          import sys, zipfile, shutil
          from pathlib import Path
          root=Path(sys.argv[1])
          apks=root/'tryrtyrt.apks'
          apk_path=root/'split_obbassets.apk'
          payload=root/'main-payload.zip'
          pak=root/'pakchunk0-Android_ASTC.pak'
          with zipfile.ZipFile(apks) as outer:
              with outer.open('split_obbassets.apk') as src, apk_path.open('wb') as dst:
                  shutil.copyfileobj(src,dst,8*1024*1024)
          with zipfile.ZipFile(apk_path) as apk:
              with apk.open('assets/main.obb.png') as src, payload.open('wb') as dst:
                  shutil.copyfileobj(src,dst,8*1024*1024)
          with zipfile.ZipFile(payload) as game:
              target='ShooterGame/Content/Paks/pakchunk0-Android_ASTC.pak'
              with game.open(target) as src, pak.open('wb') as dst:
                  shutil.copyfileobj(src,dst,8*1024*1024)
          print(f'Main PAK extracted: {pak.stat().st_size:,} bytes')
          PY

      - name: Install verified repak CLI
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dino-probe"
          mkdir -p "$root/tooling"
          cd "$root/tooling"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o repak.tar.xz https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            -o repak.sha256 https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz.sha256
          expected=$(awk 'NR==1 {print $1}' repak.sha256)
          actual=$(sha256sum repak.tar.xz | awk '{print $1}')
          [[ "$expected" == "$actual" ]]
          mkdir unpacked-tool
          tar -xJf repak.tar.xz -C unpacked-tool
          repak_bin=$(find unpacked-tool -type f -name repak -print -quit)
          test -n "$repak_bin"
          chmod +x "$repak_bin"
          "$repak_bin" --version
          echo "$(realpath "$repak_bin")" > "$root/repak-bin.txt"

      - name: Extract game distance configs and representative creature blueprints
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/dino-probe"
          repak_bin=$(cat "$root/repak-bin.txt")
          pak="$root/pakchunk0-Android_ASTC.pak"
          out="$root/probe-files"
          mkdir -p "$out/configs" "$out/creatures"
          configs=(
            'Engine/Config/Android/AndroidScalability.ini'
            'Engine/Config/BaseScalability.ini'
            'Engine/Config/BaseDeviceProfiles.ini'
            'ShooterGame/Config/Android/AndroidEngine.ini'
            'ShooterGame/Config/Android/AndroidGame.ini'
            'ShooterGame/Config/DefaultDeviceProfiles.ini'
            'ShooterGame/Config/DefaultEngine.ini'
            'ShooterGame/Config/DefaultGameUserSettings.ini'
          )
          for file in "${configs[@]}"; do
            name=$(basename "$file")
            "$repak_bin" get "$pak" "$file" > "$out/configs/$name"
          done
          creature_paths=(
            'ShooterGame/Content/PrimalEarth/CoreBlueprints/Dino_Character_BP.uasset'
            'ShooterGame/Content/PrimalEarth/CoreBlueprints/Dino_Character_BP.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/BaseBPs/DinoSettings_Base.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/BaseBPs/DinoSettings_Base.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/BaseBPs/DinoSettings_Carnivore.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/BaseBPs/DinoSettings_Carnivore.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/BaseBPs/DinoSettings_Herbivore.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/BaseBPs/DinoSettings_Herbivore.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/Dodo/Dodo_Character_BP.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/Dodo/Dodo_Character_BP.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/Raptor/Raptor_Character_BP.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/Raptor/Raptor_Character_BP.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/Rex/Rex_Character_BP.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/Rex/Rex_Character_BP.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/Trike/Trike_Character_BP.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/Trike/Trike_Character_BP.uexp'
            'ShooterGame/Content/PrimalEarth/Dinos/Argentavis/Argent_Character_BP.uasset'
            'ShooterGame/Content/PrimalEarth/Dinos/Argentavis/Argent_Character_BP.uexp'
          )
          for file in "${creature_paths[@]}"; do
            name=$(basename "$file")
            "$repak_bin" get "$pak" "$file" > "$out/creatures/$name"
          done
          python - "$out" <<'PY'
          import sys, re
          from pathlib import Path
          root=Path(sys.argv[1])
          report=[]
          terms=re.compile(rb'NetCullDistanceSquared|CullDistance|MaxDrawDistance|MinDrawDistance|ViewDistance|LODDistance|NetUpdateFrequency')
          report.append('# Targeted dinosaur visibility probe')
          report.append('')
          report.append('## Game configuration entries')
          for p in sorted((root/'configs').glob('*')):
              data=p.read_bytes()
              text=data.decode('utf-8','replace')
              lines=text.splitlines()
              picked=[(i,line) for i,line in enumerate(lines,1) if re.search(r'(?i)view.?distance|cull.?distance|net.?cull|draw.?distance|r\.SkeletalMeshLODRadiusScale|sg\.ViewDistanceQuality|grass\.CullDistanceScale',line)]
              report += ['', f'### {p.name} ({len(data)} bytes; {len(picked)} matching lines)']
              report += [f'{i}: {line.strip()}' for i,line in picked] if picked else ['No matching setting lines in this file.']
          report += ['', '## Creature blueprint property-name probes']
          for p in sorted((root/'creatures').glob('*')):
              data=p.read_bytes()
              report += ['', f'### {p.name} ({len(data)} bytes)']
              matches=list(terms.finditer(data))
              if not matches:
                  report.append('No known draw/replication-distance property name found as an ASCII string in this file.')
                  continue
              report.append(f'Property-name matches: {len(matches)}')
              for m in matches[:80]:
                  lo=max(0,m.start()-36); hi=min(len(data),m.end()+96)
                  frag=data[lo:hi]
                  printable=''.join(chr(b) if 32 <= b < 127 else '.' for b in frag)
                  report.append(f'offset={m.start()} token={m.group(0).decode("ascii","replace")} hex={frag.hex()} ascii={printable}')
          (root/'targeted-dino-visibility-report.md').write_text('\n'.join(report)+'\n',encoding='utf-8')
          print((root/'targeted-dino-visibility-report.md').read_text()[-18000:])
          PY

      - name: Upload the targeted report (not game binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-dino-visibility-probe
          path: ${{ runner.temp }}/dino-probe/probe-files/targeted-dino-visibility-report.md
          retention-days: 7
